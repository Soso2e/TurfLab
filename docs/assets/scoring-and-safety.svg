<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif">
  <defs>
    <linearGradient id="bgScore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1160" height="470" rx="16" fill="url(#bgScore)"/>

  <!-- Header -->
  <text x="40" y="42" fill="#f8fafc" font-size="22" font-weight="700">評価モデルの構造（53項目 → 6評価 → 固定重み計算）と5つの鉄則</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13">重複加点を防ぐため53項目を6つのCore評価軸に集約し、総合点と順位はAIではなくTurfLabのコードが決定論的に算出する</text>

  <!-- Left: 53 Factors (12 Categories) -->
  <rect x="36" y="90" width="330" height="350" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="54" y="118" fill="#38bdf8" font-size="15" font-weight="700">1. 根拠の棚卸し（53項目・12カテゴリ）</text>
  <text x="54" y="138" fill="#94a3b8" font-size="11.5">prompts/prediction-factors.md（分析順序を規定）</text>

  <text x="54" y="164" fill="#e2e8f0" font-size="12">① 馬場（6）: 芝/ダ状態・含水率・クッション値・傷み・天候</text>
  <text x="54" y="186" fill="#e2e8f0" font-size="12">② 当日傾向（4）: 先行/差し有利・内外枠・時計・通過順</text>
  <text x="54" y="208" fill="#e2e8f0" font-size="12">③ 展開・ペース（5）: 脚質・先行頭数・3展開想定・位置取り</text>
  <text x="54" y="230" fill="#e2e8f0" font-size="12">④ 走破タイム（6）: 過去/ベスト/平均時計・距離/馬場差・3F</text>
  <text x="54" y="252" fill="#e2e8f0" font-size="12">⑤ 過去実績（5）: 着順・勝数・着差・相手レベル・直接対決</text>
  <text x="54" y="274" fill="#e2e8f0" font-size="12">⑥ コース（5）・⑦ 距離適性（3）: 左右・坂・距離延長/短縮</text>
  <text x="54" y="296" fill="#e2e8f0" font-size="12">⑧ 枠順（3）・⑨ 騎手・人馬（4）: 初角距離・コンビ・戦術</text>
  <text x="54" y="318" fill="#e2e8f0" font-size="12">⑩ 成長・調子（4）: 2歳成長・少出走未知・上積み・安定性</text>
  <text x="54" y="340" fill="#e2e8f0" font-size="12">⑪ 外部予想（4）: 独自baseline作成後に根拠のみを照合</text>
  <text x="54" y="362" fill="#e2e8f0" font-size="12">⑫ シミュレーション（4）: 相対能力・3展開隊列・不確実性</text>
  <rect x="54" y="382" width="294" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="66" y="401" fill="#fcd34d" font-size="11.5" font-weight="600">※ 53項目を単純合算すると実績や時計を重複加点する</text>
  <text x="66" y="417" fill="#cbd5e1" font-size="11">→ 右の6つのCore評価軸（0〜100点）へ集約して採点</text>

  <!-- Arrow -->
  <path d="M 366 265 L 404 265" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowRight)"/>

  <!-- Center: 6 Core Components & Fixed Weights -->
  <rect x="408" y="90" width="364" height="350" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="426" y="118" fill="#93c5fd" font-size="15" font-weight="700">2. Core 6項目評価 ＆ 固定重み加重</text>
  <text x="426" y="138" fill="#bfdbfe" font-size="11.5">prompts/prediction-method.md × packages/shared/src/scoring.ts</text>

  <!-- Bars -->
  <!-- ability 25% -->
  <rect x="426" y="154" width="328" height="34" rx="6" fill="#0f172a"/>
  <rect x="426" y="154" width="164" height="34" rx="6" fill="#2563eb"/>
  <text x="436" y="176" fill="#ffffff" font-size="12.5" font-weight="700">ability（能力）: 25%</text>
  <text x="600" y="176" fill="#cbd5e1" font-size="11.5">近走内容・相手・着差・上がり</text>

  <!-- horse_jockey_course 20% -->
  <rect x="426" y="196" width="328" height="34" rx="6" fill="#0f172a"/>
  <rect x="426" y="196" width="131" height="34" rx="6" fill="#3b82f6"/>
  <text x="436" y="218" fill="#ffffff" font-size="12.5" font-weight="700">horse_jockey_course: 20%</text>
  <text x="605" y="218" fill="#cbd5e1" font-size="11.5">人馬コンビ・騎手コース戦術</text>

  <!-- course 15% -->
  <rect x="426" y="238" width="328" height="34" rx="6" fill="#0f172a"/>
  <rect x="426" y="238" width="98" height="34" rx="6" fill="#0284c7"/>
  <text x="436" y="260" fill="#ffffff" font-size="12.5" font-weight="700">course（コース）: 15%</text>
  <text x="585" y="260" fill="#cbd5e1" font-size="11.5">左右回り・坂・コーナー・距離</text>

  <!-- pace 15% -->
  <rect x="426" y="280" width="328" height="34" rx="6" fill="#0f172a"/>
  <rect x="426" y="280" width="98" height="34" rx="6" fill="#0d9488"/>
  <text x="436" y="302" fill="#ffffff" font-size="12.5" font-weight="700">pace（展開）: 15%</text>
  <text x="585" y="302" fill="#cbd5e1" font-size="11.5">脚質・先行数・3展開での位置</text>

  <!-- going 15% -->
  <rect x="426" y="322" width="328" height="34" rx="6" fill="#0f172a"/>
  <rect x="426" y="322" width="98" height="34" rx="6" fill="#059669"/>
  <text x="436" y="344" fill="#ffffff" font-size="12.5" font-weight="700">going（馬場）: 15%</text>
  <text x="585" y="344" fill="#cbd5e1" font-size="11.5">当日馬場・天候・馬場別成績</text>

  <!-- draw_weight 10% -->
  <rect x="426" y="364" width="328" height="34" rx="6" fill="#0f172a"/>
  <rect x="426" y="364" width="66" height="34" rx="6" fill="#4f46e5"/>
  <text x="436" y="386" fill="#ffffff" font-size="12.5" font-weight="700">draw_weight（枠・斤量）: 10%</text>
  <text x="615" y="386" fill="#cbd5e1" font-size="11.5">枠順・初角距離・斤量比</text>

  <text x="426" y="422" fill="#fde047" font-size="11.5" font-weight="600">点数基準: 80+明確適合 / 60-79適合 / 40-59拮抗 / 20-39不適合 / 欠測を50で埋めない</text>

  <!-- Arrow -->
  <path d="M 772 265 L 810 265" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowRight)"/>

  <!-- Right: 5 Safety Guardrails -->
  <rect x="814" y="90" width="310" height="350" rx="12" fill="#31102f" stroke="#ec4899" stroke-width="1.5"/>
  <text x="832" y="118" fill="#f472b6" font-size="15" font-weight="700">3. システムが強制する5つの鉄則</text>
  <text x="832" y="138" fill="#fbcfe8" font-size="11.5">コードで機械検証・違反時は保存拒否</text>

  <rect x="832" y="154" width="274" height="48" rx="8" fill="#1f091d" stroke="#db2777"/>
  <text x="844" y="173" fill="#fde047" font-size="12" font-weight="700">① オッズ・人気の完全排除</text>
  <text x="844" y="191" fill="#fce7f3" font-size="11">採点・展開・買い目理由に人気/オッズ表現があれば拒否</text>

  <rect x="832" y="210" width="274" height="48" rx="8" fill="#1f091d" stroke="#db2777"/>
  <text x="844" y="229" fill="#fde047" font-size="12" font-weight="700">② 情報締切（Cutoff）と発走前ロック</text>
  <text x="844" y="247" fill="#fce7f3" font-size="11">発走後のMorning新規確定やcutoff後の情報混入を拒否</text>

  <rect x="832" y="266" width="274" height="48" rx="8" fill="#1f091d" stroke="#db2777"/>
  <text x="844" y="285" fill="#fde047" font-size="12" font-weight="700">③ 追記専用（Immutability / wx）</text>
  <text x="844" y="303" fill="#fce7f3" font-size="11">既存ファイルの上書き・SHA変更を拒否。修正は別版へ</text>

  <rect x="832" y="322" width="274" height="48" rx="8" fill="#1f091d" stroke="#db2777"/>
  <text x="844" y="341" fill="#fde047" font-size="12" font-weight="700">④ AI参考推奨と本人仮想Betの完全分離</text>
  <text x="844" y="359" fill="#fce7f3" font-size="11">予想保存でBetは作らない。本人Betは1R 1千円/日5千円</text>

  <rect x="832" y="378" width="274" height="48" rx="8" fill="#1f091d" stroke="#db2777"/>
  <text x="844" y="397" fill="#fde047" font-size="12" font-weight="700">⑤ 30R以上の未使用検証まで重み不変</text>
  <text x="844" y="415" fill="#fce7f3" font-size="11">1〜2Rの結果でモデル重みを自動変更しない（本人承認制）</text>
</svg>
