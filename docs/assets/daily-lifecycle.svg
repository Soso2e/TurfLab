<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif">
  <defs>
    <linearGradient id="bgLife" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1160" height="760" rx="16" fill="url(#bgLife)"/>

  <!-- Title -->
  <text x="40" y="42" fill="#f8fafc" font-size="22" font-weight="700">1日の進行フローとCLIシステムプロンプトの連鎖（Daily Lifecycle &amp; Prompts）</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13">LocalPredictionWorker.tick() が5分周期で実行する4つのCLIプロンプト（①〜④）と、Core API・本人操作のステップバイステップ図解</text>

  <!-- ==================== STEP 1: Prompt 1 (Discovery) ==================== -->
  <rect x="40" y="92" width="510" height="175" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="58" y="108" width="230" height="24" rx="12" fill="#10b981"/>
  <text x="173" y="125" fill="#022c22" font-size="12" font-weight="700" text-anchor="middle">STEP 1｜JST 09:00〜21:00（3時間毎）</text>
  <text x="300" y="125" fill="#6ee7b7" font-size="12" font-weight="700">🌐 web_search="live"</text>
  <text x="58" y="152" fill="#ecfdf5" font-size="16" font-weight="700">CLIプロンプト①：出馬表・近走の事実収集</text>
  <text x="58" y="174" fill="#d1fae5" font-size="12">• 発走60分以上前のレースを最大5R選定（または --race-url 1件指定）</text>
  <text x="58" y="193" fill="#d1fae5" font-size="12">• 公式出馬表から全頭（馬番・馬名・騎手・枠・斤量・状態）＋近走最大3走を取得</text>
  <text x="58" y="212" fill="#fcd34d" font-size="12" font-weight="600">• 重要ルール：「オッズ・人気は採取しない」「この段階では予想・展開を作らない」</text>
  <text x="58" y="232" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → exchange/daily/YYYY-MM-DD/morning-reference-v{ts}.json</text>
  <text x="58" y="250" fill="#a7f3d0" font-size="11">※ 生成時刻はモデルの自己申告を使わず、CLIの receipt.finished_at を刻印</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 550 180 L 605 180" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowFlow)"/>

  <!-- ==================== STEP 2: Name Register & Pack + Baseline ==================== -->
  <rect x="610" y="92" width="510" height="175" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <rect x="628" y="108" width="210" height="24" rx="12" fill="#60a5fa"/>
  <text x="733" y="125" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">STEP 2｜Core API 固定化 &amp; 特徴量</text>
  <text x="852" y="125" fill="#93c5fd" font-size="12" font-weight="700">🔒 AI不使用（決定論的処理）</text>
  <text x="628" y="152" fill="#eff6ff" font-size="16" font-weight="700">名前登録・Snapshot固定・Baseline算出</text>
  <text x="628" y="174" fill="#dbeafe" font-size="12">1. POST /github-bridge/reference-register：馬・騎手を名前一致カタログ登録</text>
  <text x="628" y="193" fill="#dbeafe" font-size="12">2. POST /race-import/pack：情報締切(cutoff)・answer_schema付き固定Pack出力</text>
  <text x="628" y="212" fill="#fcd34d" font-size="12" font-weight="600">3. POST /local-predictions/baseline（recent-form-position-v1）：</text>
  <text x="642" y="231" fill="#dbeafe" font-size="11.5">近走の相対着順平均と初角位置（先頭/前方/中団/後方傾向・2走未満は不明）をDB保存</text>
  <text x="628" y="250" fill="#93c5fd" font-size="11.5" font-family="monospace">出力 → exchange/packs/YYYY-MM-DD/{race-key}-{pack_hash}.json</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 865 267 L 865 300 L 295 300 L 295 322" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowFlow)"/>

  <!-- ==================== STEP 3: Prompt 2 (1R Analysis) ==================== -->
  <rect x="40" y="326" width="510" height="195" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="58" y="342" width="210" height="24" rx="12" fill="#10b981"/>
  <text x="163" y="359" fill="#022c22" font-size="12" font-weight="700" text-anchor="middle">STEP 3｜発走前 1Rずつ直列分析</text>
  <text x="282" y="359" fill="#fca5a5" font-size="12" font-weight="700">🚫 web_search="disabled"（再検索禁止）</text>
  <text x="58" y="386" fill="#ecfdf5" font-size="16" font-weight="700">CLIプロンプト②：固定Packから1レース本分析</text>
  <text x="58" y="408" fill="#d1fae5" font-size="12">• 注入プロンプト：53項目一覧(prediction-factors.md) ＋ 6評価手順(prediction-method.md)</text>
  <text x="58" y="427" fill="#d1fae5" font-size="12">• 注入データ：{ pack, baseline(過去位置取り), source_context, 前日reviews仮説 }</text>
  <text x="58" y="446" fill="#fcd34d" font-size="12" font-weight="600">• 過去の位置取り(事実)と今回の展開(slow/middle/highの仮説)を分離して全馬採点</text>
  <text x="58" y="465" fill="#d1fae5" font-size="12">• 6項目を0〜100で相対評価（確率・MC未算出のため recommendations: []）</text>
  <text x="58" y="485" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → exchange/predictions/YYYY-MM-DD/{race-key}-morning-v1.json</text>
  <text x="58" y="504" fill="#a7f3d0" font-size="11">※ 資料不足で採点不能な場合は { blocked: true, reason: "..." } を返して保留</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 550 424 L 605 424" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowFlow)"/>

  <!-- ==================== STEP 4: Core Lock & Owner Bet ==================== -->
  <rect x="610" y="326" width="510" height="195" rx="12" fill="#431407" stroke="#f97316" stroke-width="2"/>
  <rect x="628" y="342" width="230" height="24" rx="12" fill="#f97316"/>
  <text x="743" y="359" fill="#fff7ed" font-size="12" font-weight="700" text-anchor="middle">STEP 4｜Core確定 &amp; 本人スマホ操作</text>
  <text x="872" y="359" fill="#fde047" font-size="12" font-weight="700">📱 Tailscale / Web UI</text>
  <text x="628" y="386" fill="#ffedd5" font-size="16" font-weight="700">Core Lock読返し ＆ 本人による仮想Bet</text>
  <text x="628" y="408" fill="#fed7aa" font-size="12">1. POST /pipeline/race：6項目の固定重み(25/15/15/15/10/20)で総合点・順位を計算</text>
  <text x="628" y="427" fill="#fed7aa" font-size="12">2. GET /races/:id：status="locked" を読み返して初めて「正式予想」に計上</text>
  <text x="628" y="446" fill="#fde047" font-size="12" font-weight="600">3. 本人がスマホ/PCで予想を確認し、採用版固定 ＆ 仮想Betを発走前に登録</text>
  <text x="642" y="465" fill="#fed7aa" font-size="11.5">• 1R最大1,000円 / JST 1日最大5,000円（発走前のみ revise-bet で訂正可）</text>
  <text x="642" y="484" fill="#fed7aa" font-size="11.5">• 本人BetデータはAIのプロンプトには一切渡されない（完全分離）</text>
  <text x="628" y="504" fill="#fdba74" font-size="11">※ 発走時刻を過ぎた未確定MorningはCoreが自動的に新規確定を拒否</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M 865 521 L 865 548 L 295 548 L 295 568" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowFlow)"/>

  <!-- ==================== STEP 5: Prompt 3 (Official Result) ==================== -->
  <rect x="40" y="572" width="510" height="158" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="58" y="588" width="230" height="24" rx="12" fill="#10b981"/>
  <text x="173" y="605" fill="#022c22" font-size="12" font-weight="700" text-anchor="middle">STEP 5｜発走予定から1時間後以降</text>
  <text x="302" y="605" fill="#6ee7b7" font-size="12" font-weight="700">🌐 web_search="live"</text>
  <text x="58" y="632" fill="#ecfdf5" font-size="16" font-weight="700">CLIプロンプト③：公式結果・全払戻の確認と精算</text>
  <text x="58" y="654" fill="#d1fae5" font-size="12">• JRA / keiba.go.jp 公式ページで全出走馬の着順・完走/取消・全券種払戻・公表時刻を確認</text>
  <text x="58" y="673" fill="#fcd34d" font-size="12" font-weight="600">• 3着までの抜粋や一部払戻は不可。未確定なら { blocked: true } で待機</text>
  <text x="58" y="692" fill="#d1fae5" font-size="12">• POST /github-bridge/official-result で saveResult と settle（精算）を同時実行</text>
  <text x="58" y="711" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → exchange/results/YYYY-MM-DD/{race-key}-official-v1.json</text>

  <!-- Arrow 5 -> 6 -->
  <path d="M 550 650 L 605 650" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowFlow)"/>

  <!-- ==================== STEP 6: Prompt 4 (Next-Day Review) ==================== -->
  <rect x="610" y="572" width="510" height="158" rx="12" fill="#31102f" stroke="#f43f5e" stroke-width="2"/>
  <rect x="628" y="588" width="210" height="24" rx="12" fill="#f43f5e"/>
  <text x="733" y="605" fill="#fff1f2" font-size="12" font-weight="700" text-anchor="middle">STEP 6｜翌日（前日確定分の検証）</text>
  <text x="852" y="605" fill="#fda4af" font-size="12" font-weight="700">🚫 web_search="disabled"</text>
  <text x="628" y="632" fill="#ffe4e6" font-size="16" font-weight="700">CLIプロンプト④：採用予想×公式結果の振り返り</text>
  <text x="628" y="654" fill="#fecdd3" font-size="12">• 保存済みの採用予想と公式結果だけを比較（着順から実ペースを勝手に断定しない）</text>
  <text x="628" y="673" fill="#fde047" font-size="12" font-weight="600">• observations / hypotheses / unknowns / validation_plan の4配列を生成</text>
  <text x="628" y="692" fill="#fecdd3" font-size="12">• 翌日のプロンプト①・②へ「前日の検証仮説(feedback)」として自動注入される</text>
  <text x="628" y="711" fill="#fda4af" font-size="11.5" font-family="monospace">出力 → exchange/reviews/YYYY-MM-DD/{race-key}-v1.json &amp; POST /api/reviews</text>

  <!-- Feedback Loop Arrow from Step 6 back to Step 1 & 3 -->
  <path d="M 1120 650 L 1144 650 L 1144 140 L 554 140" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowLoop)"/>
  <text x="1136" y="410" fill="#fb7185" font-size="12" font-weight="700" transform="rotate(-90 1136 410)" text-anchor="middle">翌日プロンプト①・②へ feedback として自動注入</text>
</svg>
