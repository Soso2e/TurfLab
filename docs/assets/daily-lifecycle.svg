<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1010" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif">
  <defs>
    <linearGradient id="bgLife" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1160" height="760" rx="16" fill="url(#bgLife)"/>
  <rect width="1160" height="1010" rx="16" fill="url(#bgLife)"/>
  <text x="40" y="42" fill="#f8fafc" font-size="22" font-weight="700">1日の進行フロー（Daily Lifecycle）— 全自動で積み上げ、本人は上乗せだけ</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13">LocalPredictionWorker.tick() が5分周期で1レースにつき1段階だけ進める。選定は最大3R/日。CLI（AI）とコードの担当を色で区別</text>
  <rect x="40" y="92" width="510" height="175" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="58" y="108" width="250" height="24" rx="12" fill="#10b981"/>
  <text x="183.0" y="125" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">段階1｜収集（Gemini）</text>
  <text x="320" y="125" fill="#6ee7b7" font-size="12" font-weight="700">🌐 AI（CLI）</text>
  <text x="58" y="152" fill="#f8fafc" font-size="16" font-weight="700">出馬表・近走・騎手の収集</text>
  <text x="58" y="174" fill="#e2e8f0" font-size="12">• JST 09:00〜21:00（3時間枠）に、発走60分以上前のレースを最大3R選定</text>
  <text x="58" y="193" fill="#e2e8f0" font-size="12">• 全頭固定→各馬の近走5走・騎手の同場成績を収集（保存済みの走は再検索しない）</text>
  <text x="58" y="212" fill="#fcd34d" font-size="12" font-weight="600">• 「オッズ・人気は採取しない」「この段階では予想・展開を作らない」</text>
  <text x="58" y="231" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → 個体DB（horses / jockeys / performances）＋ daily/*.json</text>
  <text x="58" y="250" fill="#94a3b8" font-size="11.5">※ 前日レビューの仮説(feedback)を調査プロンプトに注入</text>
  <rect x="610" y="92" width="510" height="175" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <rect x="628" y="108" width="250" height="24" rx="12" fill="#60a5fa"/>
  <text x="753.0" y="125" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">段階2｜再評価・固定化</text>
  <text x="890" y="125" fill="#93c5fd" font-size="12" font-weight="700">⚙ コード中心</text>
  <text x="628" y="152" fill="#f8fafc" font-size="16" font-weight="700">欠測だけ補完し、packを固定</text>
  <text x="628" y="174" fill="#e2e8f0" font-size="12">• 根拠の充足を判定（observed / weak / missing）し、欠測だけを補完検索（最大2回/R）</text>
  <text x="628" y="193" fill="#e2e8f0" font-size="12">• 傾向集計（枠・脚質・同日同場）とbaseline（相対着順・初角位置）はコードのみ</text>
  <text x="628" y="212" fill="#fcd34d" font-size="12" font-weight="600">• snapshot→pack（情報締切・ハッシュ固定）。保存済みの個体は再検索しない</text>
  <text x="628" y="231" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → packs/YYYY-MM-DD/{race-key}-{pack_hash}.json</text>
  <text x="628" y="250" fill="#94a3b8" font-size="11.5">※ 全て固定入力。cutoff後の情報は混ぜない</text>
  <path d="M 550 180 L 605 180" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowFlow)"/>
  <path d="M 865 267 L 865 300 L 295 300 L 295 322" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowFlow)"/>
  <rect x="40" y="326" width="510" height="195" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="58" y="342" width="250" height="24" rx="12" fill="#10b981"/>
  <text x="183.0" y="359" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">段階3｜予想（Codex/Claude）</text>
  <text x="320" y="359" fill="#fca5a5" font-size="12" font-weight="700">🚫 Web再検索禁止</text>
  <text x="58" y="386" fill="#f8fafc" font-size="16" font-weight="700">固定packから1レース本分析</text>
  <text x="58" y="408" fill="#e2e8f0" font-size="12">• 外部予想の根拠確認（1回）→ 53項目を6評価（0〜100）へ集約</text>
  <text x="58" y="427" fill="#e2e8f0" font-size="12">• 過去の位置取り（事実）と今回の展開（slow/middle/high の仮説）を分離</text>
  <text x="58" y="446" fill="#fcd34d" font-size="12" font-weight="600">• AIは評価と展開だけ。総合点・順位・確率はコードが算出</text>
  <text x="58" y="465" fill="#e2e8f0" font-size="12">• 的中狙い600円を予想直後に固定（オッズ不使用・plans/-hit.json）</text>
  <text x="58" y="484" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → predictions/YYYY-MM-DD/{race-key}-morning-v1.json</text>
  <text x="58" y="503" fill="#94a3b8" font-size="11.5">※ 資料不足は {blocked:true} で保留。欠測を50点で埋めない</text>
  <rect x="610" y="326" width="510" height="195" rx="12" fill="#431407" stroke="#f97316" stroke-width="2"/>
  <rect x="628" y="342" width="200" height="24" rx="12" fill="#f97316"/>
  <text x="728.0" y="359" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Core確定＆自動採用</text>
  <text x="840" y="359" fill="#fde047" font-size="12" font-weight="700">⚙ コード（人手なし）</text>
  <text x="628" y="386" fill="#f8fafc" font-size="16" font-weight="700">完全自動の取り込み</text>
  <text x="628" y="408" fill="#e2e8f0" font-size="12">1. /pipeline/race：固定重み(25/15/15/15/10/20)で総合点・順位を計算</text>
  <text x="628" y="427" fill="#e2e8f0" font-size="12">2. locked を読み返せたら「正式予想」に計上（Final優先）</text>
  <text x="628" y="446" fill="#fcd34d" font-size="12" font-weight="600">3. 読み返し成功と同時に採用版として自動固定（本人の操作は不要）</text>
  <text x="628" y="465" fill="#e2e8f0" font-size="12">4. AIの仮想Bet＝1R 1,000円（的中狙い600＋期待値400）を自動記録</text>
  <text x="628" y="484" fill="#94a3b8" font-size="11.5">※ 発走後の未確定Morningは新規確定を拒否。確定後の差し替えなし</text>
  <path d="M 550 424 L 605 424" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowFlow)"/>
  <path d="M 865 521 L 865 548 L 295 548 L 295 568" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowFlow)"/>
  <rect x="40" y="572" width="510" height="195" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <rect x="58" y="588" width="270" height="24" rx="12" fill="#10b981"/>
  <text x="193.0" y="605" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">段階4｜発走10分前（1回だけ）</text>
  <text x="340" y="605" fill="#6ee7b7" font-size="12" font-weight="700">🌐 AI（CLI）</text>
  <text x="58" y="632" fill="#f8fafc" font-size="16" font-weight="700">馬場・オッズ確認 → 期待値買いを確定</text>
  <text x="58" y="654" fill="#e2e8f0" font-size="12">• 発走10〜5分前に入った最初のtickで1回だけ実行（60分前の取得は廃止）</text>
  <text x="58" y="673" fill="#e2e8f0" font-size="12">• 馬場・当日傾向・単勝＋上位組合せのオッズを確認</text>
  <text x="58" y="692" fill="#fcd34d" font-size="12" font-weight="600">• EV1.1以上を最大4点×100円＝期待値買い400円。無ければ見送り</text>
  <text x="58" y="711" fill="#e2e8f0" font-size="12">• 確定後は差し替えない。取得できなければ見送りを記録</text>
  <text x="58" y="730" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → prerace/*.json ・ plans/YYYY-MM-DD/{race}-evm.json</text>
  <text x="58" y="749" fill="#94a3b8" font-size="11.5">※ 馬場だけは発走3時間前から別途再確認（新packで再予想）</text>
  <rect x="610" y="572" width="510" height="195" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <rect x="628" y="588" width="150" height="24" rx="12" fill="#38bdf8"/>
  <text x="703.0" y="605" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">結果・精算</text>
  <text x="790" y="605" fill="#7dd3fc" font-size="12" font-weight="700">🌐 AI＋⚙ コード</text>
  <text x="628" y="632" fill="#f8fafc" font-size="16" font-weight="700">公式結果の確認と自動精算</text>
  <text x="628" y="654" fill="#e2e8f0" font-size="12">• 発走1時間後〜：全着順・取消・全払戻・公表時刻を公式ページで確認</text>
  <text x="628" y="673" fill="#e2e8f0" font-size="12">• saveResult → settle を直列実行（一部払戻・暫定結果は不可）</text>
  <text x="628" y="692" fill="#fcd34d" font-size="12" font-weight="600">• AI側とは別に、本人Betも結果で自動精算される</text>
  <text x="628" y="711" fill="#e2e8f0" font-size="12">• outcomes比較（LLM不使用）→ 学習レポート・台帳を更新</text>
  <text x="628" y="730" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → results/*-official-v1.json ・ outcomes/ ・ ledger</text>
  <text x="628" y="749" fill="#94a3b8" font-size="11.5">※ 台帳は出資金10万円を起点に残高を算出（Python）</text>
  <path d="M 550 670 L 605 670" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowFlow)"/>
  <path d="M 865 767 L 865 794 L 295 794 L 295 818" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowFlow)"/>
  <rect x="40" y="822" width="510" height="158" rx="12" fill="#31102f" stroke="#f43f5e" stroke-width="2"/>
  <rect x="58" y="838" width="150" height="24" rx="12" fill="#f43f5e"/>
  <text x="133.0" y="855" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">翌日｜振り返り</text>
  <text x="220" y="855" fill="#fda4af" font-size="12" font-weight="700">🚫 Web再検索禁止</text>
  <text x="58" y="882" fill="#f8fafc" font-size="16" font-weight="700">採用予想×公式結果のレビュー</text>
  <text x="58" y="904" fill="#e2e8f0" font-size="12">• 保存済みの採用予想と公式結果だけを比較（着順から実ペースを断定しない）</text>
  <text x="58" y="923" fill="#fcd34d" font-size="12" font-weight="600">• observations / hypotheses / unknowns / validation_plan を生成</text>
  <text x="58" y="942" fill="#e2e8f0" font-size="12">• 翌日の調査・予想プロンプトへ feedback として自動注入</text>
  <text x="58" y="961" fill="#a7f3d0" font-size="11.5" font-family="monospace">出力 → reviews/YYYY-MM-DD/{race-key}-v1.json ＋ POST /api/reviews</text>
  <rect x="610" y="822" width="510" height="158" rx="12" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <rect x="628" y="838" width="130" height="24" rx="12" fill="#fb923c"/>
  <text x="693.0" y="855" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">本人の上乗せ</text>
  <text x="770" y="855" fill="#fde047" font-size="12" font-weight="700">📱 Web / iPhone</text>
  <text x="628" y="882" fill="#f8fafc" font-size="16" font-weight="700">AIの1,000円に、本人が掛け金を足せる</text>
  <text x="628" y="904" fill="#e2e8f0" font-size="12">• 本人の操作は「上乗せBet」だけ。採用・取り込みは操作不要</text>
  <text x="628" y="923" fill="#fcd34d" font-size="12" font-weight="600">• 1R・1日の上限なし。出資金10万円（AI分と共通）の残高内・100円単位</text>
  <text x="628" y="942" fill="#e2e8f0" font-size="12">• 発走前のみ登録・訂正可。AIには本人Betを渡さない（完全分離）</text>
  <text x="628" y="961" fill="#94a3b8" font-size="11.5">※ 収支は AI採用参考 と 本人Bet を別集計</text>
  <path d="M 40 900 L 22 900 L 22 130 L 38 130" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowLoop)"/>
</svg>